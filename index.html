    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Battleship",
        "url": "https://battleship.correia95.workers.dev/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Single-player Battleship against a hunt-and-target computer opponent, with the standard five-ship fleet, entirely in the browser."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does the computer opponent decide where to fire?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It hunts using a checkerboard pattern first, since every ship is at least 2 cells long and must occupy at least one checkerboard-parity square. Once it lands a hit, it targets the adjacent cells until that ship is sunk, then returns to hunting."
            }
          },
          {
            "@type": "Question",
            "name": "What ships are in the fleet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The standard five: a 5-cell Carrier, 4-cell Battleship, two 3-cell ships (Cruiser and Submarine), and a 2-cell Destroyer, all placed randomly on a 10x10 board."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data sent to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Both fleets and every shot are generated and resolved entirely in your browser."
            }
          }
        ]
      }
    </script>
